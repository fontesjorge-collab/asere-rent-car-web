
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña | ASERE</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f5f0e7;
      color: #211b15;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 420px;
      margin: 50px auto;
      padding: 24px;
      background: white;
      border-radius: 14px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #d4c9b7; }
    button {
      border: 0;
      background: #d7b46a;
      font-weight: bold;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h2>Crear contraseña nueva</h2>
    <p>Escribe tu nueva contraseña para acceder al panel de ASERE.</p>
    <form id="resetForm">
      <label for="password">Nueva contraseña</label>
      <input id="password" type="password" minlength="8"
        autocomplete="new-password" required>
      <label for="confirm">Repite la contraseña</label>
      <input id="confirm" type="password" minlength="8"
        autocomplete="new-password" required>
      <button type="submit">Guardar contraseña</button>
    </form>
    <p id="message" role="status">Comprobando el enlace de recuperación…</p>
    <p><a href="/admin.html">Volver al panel de administración</a></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://euuhtluvcdmeltwrlbeo.supabase.co',
      'sb_publishable_qYp_nc1X8gmUgqv4iy35Ig_cy44MQ1s'
    );

    const message = document.getElementById('message');
    const form = document.getElementById('resetForm');

    const params = new URLSearchParams(location.hash.slice(1));
    const recoveryLink = params.get('type') === 'recovery';

    let ready = false;

    try {
      if (recoveryLink && params.get('access_token')) {
        const { error } = await supabase.auth.setSession({
          access_token: params.get('access_token'),
          refresh_token: params.get('refresh_token') || ''
        });
        if (error) throw error;
      }

      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;

      if (!data.session) {
        throw new Error('El enlace ha caducado o no es válido. Solicita otro correo de recuperación.');
      }

      ready = true;
      message.textContent = 'Enlace válido. Ya puedes crear tu contraseña nueva.';
    } catch (error) {
      message.textContent = error.message ||
        'No se pudo validar el enlace. Solicita otro correo.';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (!ready) {
        message.textContent = 'El enlace no está validado. Solicita otro correo de recuperación.';
        return;
      }

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password.length < 8) {
        message.textContent = 'La contraseña debe tener al menos 8 caracteres.';
        return;
      }

      if (password !== confirm) {
        message.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      message.textContent = 'Guardando contraseña…';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        message.textContent = 'No se pudo cambiar la contraseña: ' +
          error.message;
        return;
      }

      message.textContent =
        '¡Contraseña cambiada! Ahora abre el panel e inicia sesión.';
      form.reset();
    });
  </script>
</body>
</html>
